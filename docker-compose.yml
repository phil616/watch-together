services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      APP_ENV: development
      APP_BASE_URL: http://localhost:8080
      HTTP_LISTEN_ADDR: 0.0.0.0:8080
      DATABASE_PATH: /data/application.db
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: watchtogether
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PATH_STYLE: "true"
    volumes: ["app-data:/data"]
    depends_on:
      minio-init:
        condition: service_completed_successfully
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:18080,http://localhost:8080,http://localhost:5173
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 2s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/watchtogether"]
volumes:
  app-data:
  minio-data:
